          <!-- EMPLOYEE SCREEN -->
          <div id="emp-screen" class="screen">
            <div class="topbar">
              <button class="topbar-back" onclick="goHome()">←</button>
              <span class="topbar-title">Employee — Billing</span>
              <div class="topbar-right">
<button class="btn btn-ghost" onclick="openTillClosing()" style="padding:6px 14px;font-size:.8rem">🔒 Closing</button>
                <span class="badge badge-blue" id="emp-clock"></span>
              </div>
            </div>
            <div class="emp-body">
              <!-- Bill -->
              <div class="bill-panel">
                <div class="bill-header">
                  <span class="scan-icon">⬛</span>
                    <input type="text" id="barcode-input" placeholder="Scan barcode or type product code..." autofocus>
                </div>
                <div class="bill-table-wrap">
                  <table class="bill-table">
                    <thead>
                      <tr>
                        <th style="width:40px">#</th>
                        <th>Item</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Total</th>
                        <th style="width:40px"></th>
                      </tr>
                    </thead>
                    <tbody id="bill-tbody">
                      <tr id="bill-empty-row">
                        <td colspan="6">
                          <div class="bill-empty">
                            <span>⬛</span>
                            <p>Scan a barcode or select a product below</p>
                          </div>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
                <div class="bill-footer">
                  <div class="bill-totals">
                    <div class="bill-total-row">
                      <div class="label">Items</div>
                      <div class="value" id="total-items">0</div>
                    </div>
                    <div class="bill-total-row grand">
                      <div class="label">Total</div>
                      <div class="value" id="total-amount">Rs. 0.00</div>
                    </div>
                  </div>
                  <div style="display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-bottom:10px">
                    <span style="font-size:.8rem;color:var(--text3)">Customer pays</span>
                    <span style="font-family:var(--mono);font-size:.82rem;color:var(--text2)">Rs.</span>
                                        <input type="text" inputmode="decimal" id="cash-input" placeholder="0"
                    style="width:110px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius2);color:var(--text);font-family:var(--mono);font-size:.95rem;padding:7px 10px;outline:none;text-align:right"
                    oninput="this.value=this.value.replace(/[^0-9.]/g,'');calcChange()" onkeydown="cashInputKeydown(event)">
                    <span style="font-size:.82rem;color:var(--text3)">=</span>
                    <span style="font-family:var(--mono);font-size:1.1rem;font-weight:700;min-width:120px;text-align:right" id="change-display">—</span>
                  </div>
                  <div class="bill-actions">
                    <button class="btn btn-danger" onclick="clearBill()">🗑 Clear</button>
                    <button class="btn btn-ghost" onclick="openRecords()">📋 Record</button>
                    <button class="btn btn-ghost" onclick="openSpending()">💸 Spending</button>
                    <button class="btn btn-ghost" onclick="showCustomProductPrompt()">✏️ Custom</button>
                    <div style="position:relative;display:inline-block">
                      <button class="btn btn-ghost" onclick="togglePayDropdown()" id="pay-method-btn">💳 Cash ▾</button>
                      <div id="pay-dropdown" style="display:none;position:absolute;bottom:110%;left:0;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);min-width:160px;z-index:100;padding:6px 0;box-shadow:0 8px 24px #0006">
                        <div style="font-size:.7rem;color:var(--text3);padding:4px 14px 6px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);margin-bottom:4px">Payment Method</div>
                        <div onclick="selectPayMethod('Cash')" class="pay-option">💵 Cash</div>
                        <div onclick="selectPayMethod('Easypaisa')" class="pay-option">📱 Easypaisa</div>
                        <div onclick="selectPayMethod('JazzCash')" class="pay-option">📱 JazzCash</div>
                        <div onclick="selectPayMethod('Card')" class="pay-option">💳 Card</div>
                        <div onclick="selectPayMethod('Bank Transfer')" class="pay-option">🏦 Bank Transfer</div>
                      </div>
                    </div>
                    
                  <button class="btn btn-ghost" onclick="showShopHoursPrompt()">🏪 Shop Hours</button>
                    <button class="btn btn-ghost" onclick="printReceipt()">🖨 Print</button>
                    <button class="btn btn-success" id="checkout-btn" onclick="checkout()">✓ Checkout</button>
                  </div>
                </div>
              </div>

              <!-- Catalog -->
              <div class="catalog-overlay" id="catalog-overlay" onclick="closeCatalog()"></div>
              <button class="emp-catalog-toggle" id="emp-catalog-toggle" onclick="toggleCatalog()">📦 Products</button>
              <div class="catalog-panel" id="emp-catalog">
                <div style="padding:10px;border-bottom:1px solid var(--border);background:var(--bg2)">
                  <div style="position:relative">
                    <input type="text" id="emp-price-search" placeholder="Search by barcode..." oninput="renderEmpProducts()" style="width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius2);color:var(--text);font-family:var(--mono);font-size:.85rem;padding:8px 30px 8px 12px;outline:none">
                    <button onclick="clearEmpPriceSearch()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border:none;border-radius:4px;background:var(--bg4);color:var(--text2);cursor:pointer;font-size:.75rem;display:flex;align-items:center;justify-content:center">✕</button>
                  </div>
                </div>
                <div class="catalog-row">
                  <div class="cat-list" id="emp-cat-list"></div>
                  <div class="prod-grid-wrap">
                    <div class="prod-grid" id="emp-prod-grid"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
