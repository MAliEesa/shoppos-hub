          <div id="login-gate" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:5000;align-items:center;justify-content:center">
            <div style="background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:32px;min-width:320px;box-shadow:0 24px 80px #0008">
