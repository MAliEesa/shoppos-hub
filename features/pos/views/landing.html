          <!-- LANDING -->
          <div id="landing">
            <div class="landing-toggles">
              <button class="toggle-icon-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Light / Dark theme">🌙</button>
              <button class="toggle-icon-btn" id="privacy-toggle-btn" onclick="togglePrivacyMode()" title="Privacy mode">🙈</button>
            </div>
            <div class="landing-time" id="clock"></div>
            <select id="adm-role-select" onchange="setAdminRole(this.value)" title="Which admin login the Administration card uses" style="position:fixed;top:48px;right:24px;z-index:10;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius2);color:var(--text);font-family:var(--mono);font-size:.75rem;padding:5px 8px;outline:none;cursor:pointer">
              <option value="owner">Owner (full access)</option>
              <option value="admin">Admin (limited)</option>
            </select>
            <div class="landing-title">
              <h1>ShopOS</h1>
              <p>Point of Sale System</p>
            </div>
            <div class="landing-cards">
              <div class="landing-card emp" onclick="openScreen('emp')">
                <div class="landing-card-icon">🧾</div>
                <h2>Employee</h2>
                <p>Billing & checkout for shop workers</p>
              </div>
              <div class="landing-card adm" onclick="openScreen('adm')">
                <div class="landing-card-icon">⚙️</div>
                <h2>Administration</h2>
                <p>Products, inventory & monitoring</p>
              </div>
            </div>
          </div>
