                <!-- TILL CHECK -->
                <div class="section-tab" id="tab-tillcheck">
                  <div style="flex:1;overflow-y:auto;padding:20px;padding-bottom:80px;display:flex;flex-direction:column;gap:20px">

                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px">
                      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px 16px">
                        <div style="font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em">Closings</div>
                        <div style="font-family:var(--mono);font-size:1.2rem;font-weight:700" id="tc-stat-total">0</div>
                      </div>
                      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px 16px">
                        <div style="font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em">Matched</div>
                        <div style="font-family:var(--mono);font-size:1.2rem;font-weight:700;color:var(--accent2)" id="tc-stat-ok">0</div>
                      </div>
                      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:12px 16px">
                        <div style="font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.05em">Mismatches</div>
                        <div style="font-family:var(--mono);font-size:1.2rem;font-weight:700;color:var(--danger)" id="tc-stat-bad">0</div>
                      </div>
                    </div>

                    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px">
                      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                        <div style="font-size:.85rem;font-weight:600;color:var(--accent)">⚖️ Till Check</div>
                        <button class="btn btn-ghost" style="padding:4px 10px;font-size:.75rem" onclick="renderTillCheck()">↻ Refresh</button>
                      </div>
                      <div style="font-size:.78rem;color:var(--text3);margin-bottom:14px">What the employee typed at closing, checked against the sales saved in the system. Tap a row for details.</div>
                      <div id="tc-list" style="display:flex;flex-direction:column;gap:8px">
                        <div style="color:var(--text3);font-size:.82rem">No closings yet</div>
                      </div>
                    </div>

                  </div>
                </div>
